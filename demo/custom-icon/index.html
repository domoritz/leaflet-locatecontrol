<!doctype html>
<html lang="en">
  <head>
    <title>Demo Leaflet.Locate - Custom Icons</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../../favicon.svg" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet-src.esm.js"
        }
      }
    </script>
    <link rel="stylesheet" href="../../dist/L.Control.Locate.min.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <button id="dark-mode-toggle" title="Demo: Toggle Dark Mode to see control color changes">🌓</button>
    <div class="info">
      <h3>Custom Icons & Colors</h3>
      <p>This demo shows two customizations:</p>
      <p><strong>1. Custom Icon:</strong> Font Awesome <code>fa-crosshairs</code> instead of default SVG</p>
      <p><strong>2. Custom Colors:</strong> via CSS variables</p>
      <div class="status-demo">
        <span class="color-box color-inactive"></span>
        <span>Inactive (gray)</span>
      </div>
      <div class="status-demo">
        <span class="color-box color-active"></span>
        <span>Active (green)</span>
      </div>
      <div class="status-demo">
        <span class="color-box color-following"></span>
        <span>Following (purple)</span>
      </div>
      <p style="margin-top: 12px; font-size: 0.9em">
        <strong>Source:</strong>
        <a href="https://github.com/domoritz/leaflet-locatecontrol/blob/gh-pages/demo/custom-icon/script.js" target="_blank">script.js</a> •
        <a href="https://github.com/domoritz/leaflet-locatecontrol/blob/gh-pages/demo/custom-icon/style.css" target="_blank">style.css</a>
      </p>
    </div>
    <div id="map" style="width: 100%; height: 100%"></div>
    <div id="forkmeongithub"><a href="https://github.com/domoritz/leaflet-locatecontrol" target="_blank">Fork me on GitHub</a></div>
  </body>
</html>
